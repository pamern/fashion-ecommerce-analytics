[project]
name = "fashion-ecommerce-analytics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dbt-core>=1.12.0",
    "dbt-postgres>=1.11.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.3",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
