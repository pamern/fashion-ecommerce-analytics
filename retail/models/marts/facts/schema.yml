version: 2

models:
  - name: fact_sales
    description: Sales fact at one row per product in an order.
    columns:
      - name: sales_key
        description: Surrogate primary key for the order-product line.
        data_tests: [not_null, unique]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fact_order'), field: order_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_id}
      - name: zip
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_geography'), field: zip}
      - name: quantity
        data_tests: [not_null, non_negative]
      - name: unit_price
        data_tests: [not_null, non_negative]
      - name: discount_amount
        data_tests: [not_null, non_negative]
      - name: gross_sales
        data_tests: [not_null, non_negative]
      - name: net_sales
        data_tests: [not_null, non_negative]
      - name: cogs_amount
        data_tests: [not_null, non_negative]

  - name: fact_order
    description: Order fact at one row per order.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: ship_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: delivery_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_id}
      - name: zip
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_geography'), field: zip}
      - name: order_status
        data_tests: [not_null]
      - name: device_type
        data_tests: [not_null]
      - name: order_source
        data_tests: [not_null]
      - name: payment_method
        data_tests: [not_null]
      - name: shipping_fee
        data_tests: [non_negative]
      - name: installments
        data_tests: [not_null, non_negative]
      - name: delivery_days
        data_tests:
          - accepted_range:
              arguments: {min_value: 0}

  - name: fact_return
    description: Return fact at one row per returned product/order line.
    columns:
      - name: return_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fact_order'), field: order_id}
      - name: return_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_id}
      - name: zip
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_geography'), field: zip}
      - name: return_quantity
        data_tests: [not_null, non_negative]
      - name: return_amount
        data_tests: [not_null, non_negative]
      - name: return_reason
        data_tests: [not_null]

  - name: fact_inventory
    description: Inventory fact at one row per product and snapshot date.
    columns:
      - name: inventory_key
        data_tests: [not_null, unique]
      - name: shop_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: stock_on_hand
        data_tests: [not_null, non_negative]
      - name: units_received
        data_tests: [not_null, non_negative]
      - name: units_sold
        data_tests: [not_null, non_negative]
      - name: stockout_days
        data_tests: [not_null, non_negative]
      - name: days_of_supply
        data_tests: [not_null, non_negative]
      - name: fill_rate
        data_tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: sell_through_rate
        data_tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: stockout_flag
        data_tests: [not_null]
      - name: reorder_flag
        data_tests: [not_null]

  - name: fact_web_traffic
    description: Web-traffic fact at one row per traffic source and date.
    columns:
      - name: web_traffic_key
        data_tests: [not_null, unique]
      - name: traffic_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: traffic_source_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_traffic_source'), field: traffic_source_key}
      - name: sessions
        data_tests: [not_null, non_negative]
      - name: unique_visitors
        data_tests: [not_null, non_negative]
      - name: page_views
        data_tests: [not_null, non_negative]
      - name: bounce_rate
        data_tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: avg_session_duration
        data_tests: [not_null, non_negative]
