version: 2

models:
  - name: bridge_sales_promotion
    description: Bridge at one row per sales line and applied promotion.
    columns:
      - name: sales_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fact_sales'), field: sales_key}
      - name: promo_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_promotion'), field: promo_id}
