version: 2

models:
  - name: mart_customer
    description: >
      Lean customer reporting mart at one row per customer. Purchase measures
      use fulfilled (delivered or returned) orders and the latest source order
      date as the stable reporting date. Revenue is net of discounts.
    columns:
      - name: customer_key
        description: Primary key of the customer reporting mart.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: customer_id
        data_tests: [not_null, unique]
      - name: signup_date
        data_tests: [not_null]
      - name: days_since_last_purchase
        data_tests: [non_negative]
      - name: customer_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['prospect', 'active', 'at_risk', 'churned']
      - name: total_orders
        data_tests: [not_null, non_negative]
      - name: total_quantity
        data_tests: [not_null, non_negative]
      - name: total_revenue
        data_tests: [not_null, non_negative]
      - name: average_order_value
        data_tests: [not_null, non_negative]
      - name: is_repeat_customer
        data_tests: [not_null]
      - name: rfm_segment
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Low-Value Customers
                  - Mid-Value Customers
                  - High-Value Customers
