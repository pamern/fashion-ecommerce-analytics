version: 2

models:
  - name: mart_customer
    description: >
      Customer-level analytical mart at one row per customer. Purchase measures
      use fulfilled (delivered or returned) orders, and total_sales is net of
      discounts. The latest source order date is the stable reporting date for
      days_since_last_purchase and segment.
    columns:
      - name: customer_id
        description: Business customer identifier and primary key of the mart.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: signup_date
        data_tests: [not_null]

      - name: segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['prospect', 'active', 'at_risk', 'churned']

      - name: total_orders
        data_tests: [not_null, non_negative]

      - name: total_quantity
        data_tests: [not_null, non_negative]

      - name: total_sales
        data_tests: [not_null, non_negative]

      - name: aov
        data_tests: [not_null, non_negative]

      - name: rfm_segment
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Low-Value Customers
                  - Mid-Value Customers
                  - High-Value Customers

      - name: days_since_last_purchase
        data_tests: [non_negative]
